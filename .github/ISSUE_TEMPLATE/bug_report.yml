name: Relatar problema
description: Erro em um exemplo, explicação ou automação
labels: [bug, needs-triage]
body:
  - type: input
    id: area
    attributes:
      label: Linguagem, tema ou caminho
      placeholder: python/messaging/in-memory-pub-sub
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Problema e passos para reproduzir
      description: Inclua versão da ferramenta, sistema operacional e comando executado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e critérios de conclusão
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Resultado observado e logs
      description: Use fontes primárias; remova segredos e dados pessoais.
    validations:
      required: true
