name: Melhorar documentação
description: Correção ou melhoria de clareza
labels: [documentation, needs-triage]
body:
  - type: input
    id: area
    attributes:
      label: Linguagem, tema ou caminho
      placeholder: python/messaging/in-memory-pub-sub
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Objetivo e contexto
      description: Explique o que você quer aprender ou melhorar e por quê.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e critérios de conclusão
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Referências e proposta
      description: Use fontes primárias; remova segredos e dados pessoais.
