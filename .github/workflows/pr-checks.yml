name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR title
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked python -m utils.check_commit --title "$PR_TITLE"

  tooling:
    name: Tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: projects
      - run: uv run pytest

  discover:
    name: Discover studies
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      count: ${{ steps.projects.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
      - id: projects
        shell: bash
        run: |
          matrix="$(uv run --locked python -m utils.projects discover)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"

  studies:
    name: Study (${{ matrix.path }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: ${{ matrix.path }}/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'ts'
        with:
          node-version: "24"
      - name: Prepare Rust
        if: matrix.language == 'rust'
        run:
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare C++
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format cmake ninja-build
      - name: Check study
        env:
          PROJECT_PATH: ${{ matrix.path }}
        run: uv run --locked python -m utils.projects check --project "$PROJECT_PATH"

  required:
    name: PR checks
    if: always()
    needs: [metadata, tooling, discover, studies]
    runs-on: ubuntu-24.04
    env:
      METADATA: ${{ needs.metadata.result }}
      TOOLING: ${{ needs.tooling.result }}
      DISCOVER: ${{ needs.discover.result }}
      STUDIES: ${{ needs.studies.result }}
      COUNT: ${{ needs.discover.outputs.count }}
    steps:
      - name: Require all applicable checks
        shell: bash
        run: |
          test "$METADATA" = success
          test "$TOOLING" = success
          test "$DISCOVER" = success
          if [ "$COUNT" = 0 ]; then
            test "$STUDIES" = skipped
            echo "No executable studies yet; shared tooling was checked." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$STUDIES" = success
          fi
