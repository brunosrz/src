# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: pt-BR
tone_instructions:
  "Explique o motivo dos problemas e sugira exemplos pequenos. Priorize correção, testes e
  aprendizado."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/uv.lock"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
  path_instructions:
    - path: "**/*"
      instructions:
        "Este é um repositório de estudos. Confira reprodução, testes, casos de erro e trade-offs;
        não imponha arquitetura de produção a exercícios pequenos."
    - path: "**/*.md"
      instructions:
        "Revise clareza em português, pré-requisitos, comandos e distinção entre planejado e
        implementado."
chat:
  auto_reply: true
