[project]
name = "src-tooling"
version = "0.1.0"
description = "Ferramentas do repositório de estudos de engenharia de software"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pre-commit>=4.3,<5",
  "ruff>=0.15,<0.16",
  "ty>=0.0.1,<1",
  "pytest>=9,<10",
  "bandit>=1.8,<2",
  "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]
